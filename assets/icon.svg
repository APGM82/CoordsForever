<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Coords Forever">
  <title>Coords Forever</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14304a"/>
      <stop offset="1" stop-color="#070f18"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0" stop-color="#8ad4ff" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#3a8fd0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#3a8fd0" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ad4ff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#2b6ea6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8ad4ff" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="panelA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfeeff"/>
      <stop offset="1" stop-color="#8fc6ea"/>
    </linearGradient>

    <linearGradient id="panelB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd3f2"/>
      <stop offset="1" stop-color="#5f9fcc"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe680"/>
      <stop offset="1" stop-color="#ffb800"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#glow)"/>
  <rect x="14" y="14" width="484" height="484" rx="98" fill="none" stroke="url(#rim)" stroke-width="5"/>

  <!-- Mapa plegado en tres -->
  <path d="M104 150 L200 120 L200 372 L104 402 Z" fill="url(#panelA)"/>
  <path d="M200 120 L312 150 L312 402 L200 372 Z" fill="url(#panelB)"/>
  <path d="M312 150 L408 120 L408 372 L312 402 Z" fill="url(#panelA)"/>
  <path d="M104 150 L200 120 L312 150 L408 120 L408 372 L312 402 L200 372 L104 402 Z"
        fill="none" stroke="#e6f6ff" stroke-opacity="0.7" stroke-width="4" stroke-linejoin="round"/>

  <!-- Cuadricula -->
  <g fill="none" stroke="#2b6ea6" stroke-opacity="0.28" stroke-width="3">
    <path d="M104 234 L200 204 L312 234 L408 204"/>
    <path d="M104 318 L200 288 L312 318 L408 288"/>
    <path d="M152 135 L152 387"/>
    <path d="M256 135 L256 387"/>
    <path d="M360 135 L360 387"/>
  </g>

  <!-- Ruta hasta el destino -->
  <path d="M142 352 C 180 300, 220 330, 250 280 S 300 220, 334 214"
        fill="none" stroke="#14304a" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 18"/>

  <!-- Destino -->
  <g transform="rotate(45 346 196)">
    <rect x="316" y="166" width="60" height="60" rx="6" fill="#0b1a28" fill-opacity="0.9"/>
    <rect x="326" y="176" width="40" height="40" rx="4" fill="url(#gold)"/>
  </g>

  <!-- Destellos -->
  <g fill="#e6f6ff">
    <path d="M430 52 L436 72 L456 78 L436 84 L430 104 L424 84 L404 78 L424 72 Z" fill-opacity="0.8"/>
    <path d="M86 410 L91 425 L106 430 L91 435 L86 450 L81 435 L66 430 L81 425 Z" fill-opacity="0.5"/>
  </g>
</svg>
